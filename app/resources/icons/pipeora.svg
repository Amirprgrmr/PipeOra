<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- پس‌زمینه گرادیان عمیق گرافیتی -->
    <linearGradient id="poBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B212D"/>
      <stop offset="45%" stop-color="#141821"/>
      <stop offset="100%" stop-color="#0D0F15"/>
    </linearGradient>

    <!-- گرادیان فریم و بردر ظریف -->
    <linearGradient id="poBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D4B66"/>
      <stop offset="50%" stop-color="#242C3D"/>
      <stop offset="100%" stop-color="#171C27"/>
    </linearGradient>

    <!-- گرادیان سیان الکتریک اصلی (Pipe Flow) -->
    <linearGradient id="poCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5E5FF"/>
      <stop offset="40%" stop-color="#67C9F3"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- گرادیان ثانویه زمردی هارمونیک (Aura Pulse) -->
    <linearGradient id="poEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="60%" stop-color="#55CFA0"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- گرادیان حلقه اورا (Sonic Aura) -->
    <linearGradient id="poAuraRingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.8"/>
    </linearGradient>

    <!-- درخشش شعاعی هاله‌ صدا (Radial Sonic Glow) -->
    <radialGradient id="poRadialGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67C9F3" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#111318" stop-opacity="0"/>
    </radialGradient>

    <!-- افکت سایه برجستگی سه‌بعدی آیکون دسکتاپ -->
    <filter id="poShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="poGlowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- کانتینر اصلی اسکوئیرکل دسکتاپ با استاندارد FreeDesktop / GNOME / KDE HIG -->
  <rect x="24" y="24" width="464" height="464" rx="114" fill="url(#poBgGrad)" stroke="url(#poBorderGrad)" stroke-width="4" filter="url(#poShadow)"/>

  <!-- هاله نورانی مرکزی پالس صدا (Acoustic Aura Glow) -->
  <circle cx="256" cy="256" r="190" fill="url(#poRadialGlow)"/>

  <!-- حلقه مداری نامحسوس تداعی‌کننده هماهنگی صوتی (Sonic Orbit Ring) -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#252D3D" stroke-width="3" stroke-dasharray="6 8" opacity="0.7"/>

  <!-- نماد اصلی تلفیقی Pipe & Ora (لوگومارک اختصاصی P و O پیوسته) -->
  <g id="poBrandMark" transform="translate(0, 0)">
    <!-- لوله جریان صوتی پیوسته (The Audio Flow Pipe) -->
    <!-- بدنه اصلی حرف P و اتصال لوله‌ای -->
    <path d="M 176 130 
             L 176 382 
             C 176 395 165 406 152 406 
             C 139 406 128 395 128 382 
             L 128 130 
             C 128 117 139 106 152 106 
             C 165 106 176 117 176 130 Z" 
          fill="url(#poCyanGrad)" filter="url(#poGlowEffect)"/>

    <!-- حلقه متصل اورا / پیپ (Torus Loop) -->
    <path d="M 160 116 
             C 246 116 316 172 316 244 
             C 316 316 246 372 160 372
             L 160 324
             C 220 324 268 288 268 244
             C 268 200 220 164 160 164 Z" 
          fill="url(#poCyanGrad)"/>

    <!-- امواج خروجی استریو (Radiating Stereo Sonic Waves) -->
    <!-- موج اول -->
    <path d="M 326 180 
             C 358 198 378 220 378 244 
             C 378 268 358 290 326 308" 
          fill="none" stroke="url(#poCyanGrad)" stroke-width="18" stroke-linecap="round"/>

    <!-- موج دوم با گرادیان زمردی (High-Res Audio fidelity) -->
    <path d="M 376 146 
             C 422 174 450 208 450 244 
             C 450 280 422 314 376 342" 
          fill="none" stroke="url(#poEmeraldGrad)" stroke-width="16" stroke-linecap="round" opacity="0.95"/>

    <!-- نقطه تمرکز سیگنال نئون (Core Audio Node) -->
    <circle cx="214" cy="244" r="22" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="214" cy="244" r="32" fill="none" stroke="url(#poCyanGrad)" stroke-width="6" opacity="0.8"/>
  </g>
</svg>
