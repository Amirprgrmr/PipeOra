<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191E27"/>
      <stop offset="100%" stop-color="#111318"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#85D5F6"/>
      <stop offset="100%" stop-color="#67C9F3"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55CFA0"/>
      <stop offset="100%" stop-color="#38A178"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- پس‌زمینه با گوشه‌های گرد نرم -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#2D3545" stroke-width="6" filter="url(#shadow)"/>

  <!-- حلقه بیرونی ظریف -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#222936" stroke-width="4" stroke-dasharray="8 8"/>

  <!-- امواج صوتی مدرن -->
  <g transform="translate(256, 256)" stroke-linecap="round">
    <!-- موج راست ۱ -->
    <path d="M 60,-40 A 70 70 0 0 1 60,40" fill="none" stroke="url(#accentGrad)" stroke-width="16"/>
    <!-- موج راست ۲ -->
    <path d="M 95,-70 A 115 115 0 0 1 95,70" fill="none" stroke="url(#accentGrad)" stroke-width="14" opacity="0.85"/>
    <!-- موج راست ۳ -->
    <path d="M 130,-100 A 160 160 0 0 1 130,100" fill="none" stroke="url(#accentGrad)" stroke-width="12" opacity="0.6"/>

    <!-- نماد بلندگو مرکزی -->
    <path d="M -130,-45 L -80,-45 L -35,-85 L -35,85 L -80,45 L -130,45 Z" fill="url(#accentGrad)"/>

    <!-- نماد سیگنال بلوتوث در گوشه پایین -->
    <path d="M 10,65 L 45,95 L 30,110 L 30,50 L 45,65 L 10,95" fill="none" stroke="url(#emeraldGrad)" stroke-width="8" stroke-linejoin="round"/>
  </g>
</svg>
