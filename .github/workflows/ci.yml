name: PipeOra CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test & Python Build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Audio and Qt Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libegl1 \
            libxkbcommon-x11-0 \
            libpulse0 \
            pulseaudio-utils \
            libdbus-1-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install build pytest pytest-qt

      - name: Syntax and Bytecode Validation
        run: |
          python -m compileall -q app/ tests/ scripts/

      - name: Run Automated Unit Tests (Offscreen Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/ -v

      - name: Test Wheel & Source Distribution Build
        run: |
          python -m build

  build-apps:
    name: Build Standalone App (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linux Qt & Audio Libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libpulse0 \
            pulseaudio-utils

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build & Smoke Test Standalone App
        run: |
          python scripts/build_app.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PipeOra-${{ runner.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error
