[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeora"
version = "1.0.1"
description = "PipeOra - مدیریت پیشرفته و هوشمند خروجی صدا و دستگاه‌های بلوتوث در لینوکس (PipeWire & WirePlumber)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Amirali Homayoonzadeh", email = "me@Amirprgrmr.ir" }
]
license = { text = "MIT" }
keywords = ["pipeora", "pipewire", "wireplumber", "bluez", "audio", "bluetooth", "pyside6", "parch-linux", "arch-linux"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Mixers",
]
dependencies = [
    "pyside6>=6.8.0",
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://amirprgrmr.ir"
Repository = "https://github.com/Amirprgrmr/PipeOra"
Issues = "https://github.com/Amirprgrmr/PipeOra/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
]

[project.scripts]
pipeora = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.resources.icons" = ["*.svg"]
"app.ui.styles" = ["*.qss"]
